<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Accès privé</title>
<style>
:root{--bg:#0a1012;--panel:#121c1e;--text:#e6f1ef;--muted:#86a8a3;--accent:#22c3b6;--strong:#5eeadb;--line:rgba(120,180,175,.22);--err:#ff8a8a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:radial-gradient(circle at top,rgba(34,195,182,.14),transparent 40%),var(--bg);color:var(--text);
  font:16px/1.6 "Segoe UI",Roboto,Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:min(380px,100%);background:linear-gradient(180deg,rgba(16,27,28,.98),rgba(7,12,13,.98));border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);margin-bottom:14px}
h1{margin:0 0 4px;font-size:1.35rem;letter-spacing:-.01em}
p{margin:0 0 18px;color:var(--muted);font-size:.92rem}
label{display:block;font-size:.8rem;font-weight:600;color:var(--strong);margin-bottom:6px}
input{width:100%;font:inherit;color:var(--text);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
input:focus-visible,button:focus-visible{outline:2px solid var(--strong);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:.85rem;color:var(--muted)}
.row input{width:auto;min-height:auto}
button{margin-top:18px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--bg);font:700 1rem inherit;font-family:inherit;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
#msg{min-height:1.4em;margin:12px 0 0;font-size:.88rem;color:var(--err)}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="dot" aria-hidden="true"></div>
  <h1>Accès privé</h1>
  <p>Saisis ton mot de passe pour ouvrir la page.</p>
  <label for="pw">Mot de passe</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <div class="row"><input id="keep" type="checkbox"><label for="keep" style="margin:0;color:inherit;font-weight:400">Rester connecté pendant cette session</label></div>
  <button id="go" type="submit">Ouvrir</button>
  <p id="msg" role="alert"></p>
</form>

  const enc=new TextEncoder(), dec=new TextDecoder();
  const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const MOIS={janv:1,janvier:1,fev:2,fevr:2,fevrier:2,mars:3,avr:4,avril:4,mai:5,juin:6,juil:7,juillet:7,aout:8,sept:9,septembre:9,oct:10,octobre:10,nov:11,novembre:11,dec:12,decembre:12};
  const msg=document.getElementById('msg'), btn=document.getElementById('go');

  /* Sépare la partie palindrome et la date, quelle que soit la façon d'écrire la date. */
  function split(raw){
    const s=raw.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const m=s.match(/^(.*?)[\s._\/-]*(\d{1,2})[\s._\/-]*(\d{1,2}|[a-z]+)\.?[\s._\/-]*(\d{4})$/);
    if(!m) return null;
    let mo=/^\d+$/.test(m[3])?+m[3]:MOIS[m[3]];
    if(!mo||mo>12||+m[2]<1||+m[2]>31) return null;
    return {word:m[1].replace(/[\s._-]+/g,''),date:String(+m[2]).padStart(2,'0')+String(mo).padStart(2,'0')+m[4]};
  }
  async function unwrap(pass){
    const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    for(const s of P.slots){
      try{return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(s.iv)},kek,ub(s.ct)))}catch(e){}
    }
    return null;
  }
  async function open(raw){
    const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    const html=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.data)));
    document.open(); document.write(html); document.close();
  }
  /* Session déjà ouverte */
  try{const k=sessionStorage.getItem('fdr:k'); if(k){open(ub(k)).catch(()=>sessionStorage.removeItem('fdr:k'));return}}catch(e){}

  document.getElementById('f').addEventListener('submit',async e=>{
    e.preventDefault(); msg.textContent='';
    const parts=split(document.getElementById('pw').value);
    if(!parts){msg.textContent='Il manque la date à la fin du mot de passe.';return}
    const w=parts.word;
    if(w.length<3||w!==[...w].reverse().join('')){msg.textContent='La première partie doit être un palindrome.';return}
    btn.disabled=true; btn.textContent='Vérification…';
    try{
      const raw=await unwrap(w+parts.date);
      if(!raw){msg.textContent='Mot de passe incorrect.';return}
      if(document.getElementById('keep').checked){try{sessionStorage.setItem('fdr:k',btoa(String.fromCharCode(...raw)))}catch(e){}}
      await open(raw);
    }catch(err){msg.textContent='Impossible d\'ouvrir la page dans ce navigateur.'}
    finally{btn.disabled=false; btn.textContent='Ouvrir'}
  });
})();
